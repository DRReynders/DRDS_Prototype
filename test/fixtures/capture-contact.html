<!doctype html>
<html>
<head><title>Capture fixture — contact page</title></head>
<body>
<!-- Carries the full contact form and a response promise, so the fixture pair
     exercises inconsistent CTA coverage: this page has no booking handoff and
     the homepage has no email route. -->
<header>
  <nav>
    <a href="/">Home</a>
    <a href="/contact">Contact</a>
    <a href="">WhatsApp Us</a>
  </nav>
</header>

<main>
  <h1>Contact Us</h1>
  <p>Send us a message and we'll get back to you within 1 business day.</p>

  <form>
    <input type="text" name="first" placeholder="Enter your first name">
    <input type="text" name="email" placeholder="Enter your email address" required>
    <input type="text" name="phone" placeholder="Short answer">
    <textarea name="message" placeholder="Type your message here"></textarea>
    <input type="hidden" name="csrf" value="x">
  </form>

  <a href="tel:0671623964">Call</a>
  <a href="https://api.whatsapp.com/send?phone=27671623964">WhatsApp</a>
  <a href="mailto:reception@example.co.za">Email</a>
</main>
</body>
</html>
